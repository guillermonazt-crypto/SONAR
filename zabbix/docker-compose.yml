# Zabbix 7.0 LTS para SONAR: análisis en tiempo real (problemas, disponibilidad,
# últimos valores) para que SONAR no dependa sólo de InfluxDB.
# Independiente del docker-compose de SONAR: proyecto y red propios.
#   cd zabbix && cp .env.example .env && docker compose up -d
#   python init_zabbix.py --switches --token
name: sonar-zabbix

x-db-env: &db-env
  DB_SERVER_HOST: postgres
  POSTGRES_DB: ${ZBX_POSTGRES_DB:-zabbix}
  POSTGRES_USER: ${ZBX_POSTGRES_USER:-zabbix}
  POSTGRES_PASSWORD: ${ZBX_POSTGRES_PASSWORD:?Define ZBX_POSTGRES_PASSWORD en zabbix/.env}

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${ZBX_POSTGRES_DB:-zabbix}
      POSTGRES_USER: ${ZBX_POSTGRES_USER:-zabbix}
      POSTGRES_PASSWORD: ${ZBX_POSTGRES_PASSWORD:?Define ZBX_POSTGRES_PASSWORD en zabbix/.env}
    volumes:
      - zbx_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [zabbix]

  zabbix-server:
    image: zabbix/zabbix-server-pgsql:alpine-7.0-latest
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      <<: *db-env
      ZBX_CACHESIZE: 128M
      ZBX_STARTPINGERS: 5
      ZBX_STARTSNMPPOLLERS: 5
      ZBX_ENABLE_SNMP_TRAPS: "true"
      ZBX_TIMEOUT: 10
    ports:
      - "${ZBX_SERVER_PORT:-10051}:10051"
    volumes:
      - zbx_snmptraps:/var/lib/zabbix/snmptraps
    networks: [zabbix]

  zabbix-web:
    image: zabbix/zabbix-web-nginx-pgsql:alpine-7.0-latest
    restart: unless-stopped
    depends_on:
      - zabbix-server
    environment:
      <<: *db-env
      ZBX_SERVER_HOST: zabbix-server
      PHP_TZ: America/Mexico_City
    ports:
      - "${ZBX_HTTP_PORT:-8090}:8080"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/ping"]
      interval: 30s
      timeout: 5s
      retries: 5
    networks: [zabbix]

  zabbix-agent:
    image: zabbix/zabbix-agent2:alpine-7.0-latest
    restart: unless-stopped
    hostname: zabbix-agent
    depends_on:
      - zabbix-server
    environment:
      ZBX_HOSTNAME: "Zabbix server"
      ZBX_SERVER_HOST: zabbix-server
    networks: [zabbix]

  # Opcional: docker compose --profile traps up -d
  zabbix-snmptraps:
    image: zabbix/zabbix-snmptraps:alpine-7.0-latest
    profiles: ["traps"]
    restart: unless-stopped
    ports:
      - "${ZBX_TRAPS_PORT:-162}:1162/udp"
    volumes:
      - zbx_snmptraps:/var/lib/zabbix/snmptraps
    networks: [zabbix]

volumes:
  zbx_postgres:
  zbx_snmptraps:

networks:
  zabbix:
    name: sonar-zabbix
