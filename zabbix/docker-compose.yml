# Zabbix 7.0 LTS para SONAR: análisis en tiempo real (problemas, disponibilidad,
# últimos valores) para que SONAR no dependa sólo de InfluxDB.
# Independiente del docker-compose de SONAR: proyecto y red propios.
#   cd zabbix && cp .env.example .env && docker compose up -d
#   python init_zabbix.py --switches --token
#   python init_zabbix.py --timescaledb --avanzado   (TimescaleDB, plantilla SONAR, Geomap, SLA)
name: sonar-zabbix

x-db-env: &db-env
  DB_SERVER_HOST: postgres
  POSTGRES_DB: ${ZBX_POSTGRES_DB:-zabbix}
  POSTGRES_USER: ${ZBX_POSTGRES_USER:-zabbix}
  POSTGRES_PASSWORD: ${ZBX_POSTGRES_PASSWORD:?Define ZBX_POSTGRES_PASSWORD en zabbix/.env}

services:
  # PostgreSQL 16 con TimescaleDB (misma versión mayor que postgres:16-alpine: el volumen
  # existente sirve tal cual). init_zabbix.py --timescaledb crea las hypertables.
  postgres:
    image: timescale/timescaledb:${ZBX_TIMESCALEDB_TAG:-2.19.3-pg16}
    restart: unless-stopped
    command: ["postgres", "-c", "shared_preload_libraries=timescaledb", "-c", "timescaledb.telemetry_level=off",
              "-c", "max_connections=200"]
    environment:
      POSTGRES_DB: ${ZBX_POSTGRES_DB:-zabbix}
      POSTGRES_USER: ${ZBX_POSTGRES_USER:-zabbix}
      POSTGRES_PASSWORD: ${ZBX_POSTGRES_PASSWORD:?Define ZBX_POSTGRES_PASSWORD en zabbix/.env}
    volumes:
      - zbx_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [zabbix]

  zabbix-server:
    image: zabbix/zabbix-server-pgsql:alpine-7.0-latest
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      <<: *db-env
      ZBX_CACHESIZE: 128M
      ZBX_STARTPINGERS: 5
      ZBX_STARTSNMPPOLLERS: 5
      ZBX_ENABLE_SNMP_TRAPS: "true"
      ZBX_STARTPOLLERS: 10
      ZBX_STARTTRAPPERS: 5
      ZBX_TIMEOUT: 10
    ports:
      - "${ZBX_SERVER_PORT:-10051}:10051"
    volumes:
      # Carpeta del equipo: en Windows la llena trap_relay.py (ve la IP real del switch).
      - ./snmptraps:/var/lib/zabbix/snmptraps
    networks: [zabbix]

  zabbix-web:
    image: zabbix/zabbix-web-nginx-pgsql:alpine-7.0-latest
    restart: unless-stopped
    depends_on:
      - zabbix-server
    environment:
      <<: *db-env
      ZBX_SERVER_HOST: zabbix-server
      PHP_TZ: America/Mexico_City
    ports:
      - "${ZBX_HTTP_PORT:-8090}:8080"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/ping"]
      interval: 30s
      timeout: 5s
      retries: 5
    networks: [zabbix]

  zabbix-agent:
    image: zabbix/zabbix-agent2:alpine-7.0-latest
    restart: unless-stopped
    hostname: zabbix-agent
    depends_on:
      - zabbix-server
    environment:
      ZBX_HOSTNAME: "Zabbix server"
      ZBX_SERVER_HOST: zabbix-server
    networks: [zabbix]

  # Receptor de traps SNMP en contenedor: sólo en Linux (docker compose --profile traps up -d).
  # En Windows, Docker Desktop cambia la IP de origen de los traps por la de su gateway y
  # Zabbix no sabría de qué switch vienen: ahí se usa zabbix/trap_relay.py (ver README).
  zabbix-snmptraps:
    image: zabbix/zabbix-snmptraps:alpine-7.0-latest
    profiles: ["traps"]
    restart: unless-stopped
    ports:
      - "${ZBX_TRAPS_PORT:-162}:1162/udp"
    volumes:
      - ./snmptraps:/var/lib/zabbix/snmptraps
    networks: [zabbix]

  # Proxy activo para una zona/sede: empuja al server lo que recolecta de sus switches.
  # Opcional: docker compose --profile proxy up -d  (y init_zabbix.py --proxy).
  # En otra sede se corre sólo este servicio con ZBX_SERVER_HOST=<IP del server>.
  zabbix-proxy:
    image: zabbix/zabbix-proxy-sqlite3:alpine-7.0-latest
    profiles: ["proxy"]
    restart: unless-stopped
    depends_on:
      - zabbix-server
    environment:
      ZBX_PROXYMODE: 0
      ZBX_HOSTNAME: ${ZBX_PROXY_HOSTNAME:-SONAR-proxy-zona1}
      ZBX_SERVER_HOST: ${ZBX_PROXY_SERVER:-zabbix-server}
      ZBX_PROXYOFFLINEBUFFER: 24
      ZBX_CONFIGFREQUENCY: 60
      ZBX_STARTPINGERS: 3
      ZBX_STARTSNMPPOLLERS: 3
      ZBX_TIMEOUT: 10
    volumes:
      - zbx_proxy:/var/lib/zabbix/db_data
    networks: [zabbix]

volumes:
  zbx_postgres:
  zbx_proxy:

networks:
  zabbix:
    name: sonar-zabbix
