<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SONAR - Dashboards</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', sans-serif;
            background: #0f1117;
            color: #e0e0e0;
            min-height: 100vh;
            padding: 30px;
        }

        header {
            border-bottom: 2px solid #00d4ff;
            padding-bottom: 15px;
            margin-bottom: 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header h1 {
            font-size: 2rem;
            color: #00d4ff;
            letter-spacing: 3px;
        }

        header p {
            color: #888;
            margin-top: 5px;
        }

        nav a {
            color: #888;
            text-decoration: none;
            margin-left: 20px;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        nav a:hover,
        nav a.active {
            color: #00d4ff;
        }

        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .panel-card {
            background: #1a1d27;
            border: 1px solid #2a2d3a;
            border-radius: 8px;
            padding: 15px;
        }

        .panel-card h3 {
            color: #888;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 10px;
        }

        iframe {
            width: 100%;
            height: 300px;
            border: none;
            border-radius: 4px;
        }
    </style>
</head>

<body>

    <header>
        <div>
            <h1>⬡ S.O.N.A.R.</h1>
            <p>Sistema de Observabilidad de Nodos y Análisis de Red </p>
        </div>
        <nav>
            <a href="/">Inventario</a>
            <a href="/dashboards" class="active">Dashboards</a>
        </nav>
    </header>

    <div class="grid">

        <div class="panel-card">
            <h3>CPU — SW-CORE-01</h3>
            <iframe
                src="http://localhost:3000/d-solo/ffq1oa6h7y6f4f/sonar-sw-core-01?orgId=1&panelId=1&theme=dark&refresh=10s"></iframe>
        </div>

        <div class="panel-card">
            <h3>Potencia Óptica Rx — SW-CORE-01</h3>
            <iframe
                src="http://localhost:3000/d-solo/ffq1oa6h7y6f4f/sonar-sw-core-01?orgId=1&panelId=2&theme=dark&refresh=10s"></iframe>
        </div>

    </div>

</body>

</html>
